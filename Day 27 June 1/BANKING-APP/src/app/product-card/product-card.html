
<div class="container mt-5">
  <div class="card product-card">

    <img
      [src]="product.thumbnail"
      class="card-img-top"
      alt="Product Image">

    <div class="card-body">

      <h5 class="card-title">
        {{ product.title }}
      </h5>

      <h4 class="text-success">
        ₹{{ product.price }}
      </h4>

      <p class="card-text">
        {{ product.description }}
      </p>

      <button class="btn btn-primary">
        Buy Now
      </button>

    </div>

  </div>
</div>
