<section class="min-h-screen bg-gray-100">
    <nav class="bg-white shadow-md">

        <div class="max-w-7xl mx-auto px-6">

            <div class="flex justify-between items-center h-16">

                <a
                    routerLink="/dashboard/home"
                    class="text-2xl font-bold text-blue-600"
                >
                    Smart Shop Portal
                </a>

                <div class="flex space-x-6">

                    <a
                        routerLink="/dashboard/header"
                        class="text-gray-700 hover:text-blue-600 font-medium"
                    >
                        Home
                    </a>

                    <a
                        routerLink="/dashboard/products"
                        class="text-gray-700 hover:text-blue-600 font-medium"
                    >
                        Products
                    </a>

                    <a
                        routerLink="/dashboard/profile"
                        class="text-gray-700 hover:text-blue-600 font-medium"
                    >
                        Profile
                    </a>
                    
                    @if(authService.currentUser()) {
                    <button
                        (click)="logout()"
                        class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition"
                    >
                        Logout
                    </button>
                } @else {
                    <button
                        routerLink="/login"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition"
                    >
                        Login
                    </button>
                }

                </div>

            </div>
           @if (authService.currentUser()) {

            } @else {

                <div class="flex items-center justify-center min-h-[60vh] px-4">

                    <div class="max-w-lg w-full bg-white rounded-3xl shadow-xl p-10 text-center">

                        <div class="w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full bg-blue-100">

                            <span class="text-4xl">👋</span>

                        </div>

                        <h2 class="text-3xl font-bold text-gray-800 mb-4">
                            Welcome to Smart Shop Portal
                        </h2>

                        <p class="text-gray-600 text-lg leading-relaxed mb-8">
                            Hello, Guest! Please log in to access your profile,
                            browse our latest products, and enjoy a personalized
                            shopping experience.
                        </p>

                        <button
                            routerLink="/login"
                            class="inline-flex items-center justify-center px-8 py-3
                                bg-blue-600 text-white font-semibold rounded-xl
                                shadow-md hover:bg-blue-700 hover:shadow-lg
                                transition-all duration-300 transform hover:-translate-y-1"
                        >
                            Login to Continue
                        </button>

                    </div>

                </div>

            }
        </div>

    </nav>

    <main class="p-6">

        <router-outlet></router-outlet>

    </main>

</section>
