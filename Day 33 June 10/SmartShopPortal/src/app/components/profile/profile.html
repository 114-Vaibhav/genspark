<section class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

    @if (authService.currentUser(); as user) {

        <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">

            <div class="flex flex-col items-center">

                <img
                    [src]="user.image"
                    [alt]="user.firstName + ' Profile Image'"
                    class="w-32 h-32 rounded-full border-4 border-blue-500 shadow-md object-cover"
                >

                <h1 class="text-3xl font-bold text-gray-800 mt-4">
                    Profile Details
                </h1>

                <p class="text-gray-500 mt-1">
                    {{ user.username }}
                </p>

            </div>

            <div class="mt-8 space-y-4">

                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-600">
                        First Name
                    </span>

                    <span class="text-gray-800">
                        {{ user.firstName }}
                    </span>
                </div>

                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-600">
                        Last Name
                    </span>

                    <span class="text-gray-800">
                        {{ user.lastName }}
                    </span>
                </div>

                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-600">
                        Email
                    </span>

                    <span class="text-gray-800 break-all text-right">
                        {{ user.email }}
                    </span>
                </div>

                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-600">
                        Gender
                    </span>

                    <span class="text-gray-800 capitalize">
                        {{ user.gender }}
                    </span>
                </div>

            </div>

        </div>

    } @else {

        <div class="bg-white shadow-lg rounded-xl p-8 text-center max-w-sm">

            <h2 class="text-2xl font-semibold text-gray-700 mb-4">
                No User Data Found
            </h2>

            <p class="text-gray-500">
                Please log in to view your profile details.
            </p>

        </div>

    }

</section>
