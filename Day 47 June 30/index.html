<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Azure Lab Site - Vaibhav Gupta</title>

    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-blue-600 to-indigo-900 min-h-screen flex items-center justify-center p-6 font-sans antialiased text-gray-800">

    <!-- Main Card Container -->
    <div
        class="bg-white rounded-2xl shadow-2xl p-8 max-w-lg w-full text-center transform transition duration-300 hover:scale-[1.02]">

        <!-- Top Badge -->
        <div
            class="inline-block bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-bold tracking-widest uppercase mb-6 shadow-sm">
            Azure Lab Environment
        </div>

        <!-- Name & Subtitle -->
        <h1 class="text-4xl font-extrabold text-gray-900 mb-2 tracking-tight">
            Vaibhav Gupta
        </h1>
        <h2 class="text-lg font-medium text-gray-500 mb-8">
            Cloud Enthusiast & Developer
        </h2>

        <!-- Azure Message Box -->
        <div class="bg-gray-50 rounded-xl p-6 mb-6 border border-gray-100 shadow-inner">
            <h3 class="text-xl font-bold text-blue-600 mb-3 flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M6.5 17.5l-3.5 1.5 1.5-3.5 9-9 2 2-9 9zm11-11l-2-2 1.5-1.5 2 2-1.5 1.5zm-14.5 14.5l3.5-1.5-2-2-1.5 3.5z" />
                </svg>
                Hello from Azure Blob Storage! ☁️
            </h3>
            <p class="text-gray-600 leading-relaxed">
                This page was successfully deployed using static website hosting.
            </p>
        </div>

        <!-- "Etc Etc" Footer Content -->
        <div class="text-sm text-gray-400 mt-6 border-t border-gray-100 pt-6">
            <p>Welcome to my cloud playground. Exploring Azure, CI/CD pipelines, and modern web development.</p>
        </div>

    </div>

</body>

</html>
